      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spId]
              properties:
                spId:
                  type: string
                requestId:
                  type: string
                  description: Optional request correlation from upstream AuthnRequest
                relayState:
                  type: string
                userId:
                  type: string
                  description: Optional override user; defaults to current session user
                responseMode:
                  type: string
                  enum: [form_post, json]
                  default: form_post
      responses:
        '200':
          description: HTML auto-post form or JSON payload with base64 signed SAML response
          content:
            text/html:
              schema:
                type: string
