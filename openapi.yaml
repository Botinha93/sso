openapi: 3.0.3
info:
  title: NexusID API
  version: 0.1.0
  description: OAuth2/OIDC, admin APIs, and user portal APIs.
servers:
  - url: http://127.0.0.1:4000
paths:
  /scim/v2/ServiceProviderConfig:
    get:
      summary: SCIM service provider capabilities
      responses:
        '200':
          description: Service provider configuration and supported features
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentationUri:
                    type: string
                  supported:
                    type: array
                    items:
                      type: string
                  schemas:
                    type: array
                    items:
                      type: string
  /scim/v2/Schemas:
    get:
      summary: List SCIM schemas
      responses:
        '200':
          description: SCIM schema list
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  totalResults:
                    type: integer
  /scim/v2/ResourceTypes:
    get:
      summary: List SCIM resource types
      responses:
        '200':
          description: SCIM resource type list
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  resourceTypes:
                    type: array
                    items:
                      type: object
  /scim/v2/Users:
    get:
      summary: List SCIM users
      parameters:
        - in: query
          name: startIndex
          schema: { type: integer, minimum: 1 }
        - in: query
          name: count
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: filter
          schema: { type: string }
      responses:
        '200':
          description: SCIM user list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  totalResults:
                    type: integer
                  startIndex:
                    type: integer
                  itemsPerPage:
                    type: integer
                  Resources:
                    type: array
                    items:
                      type: object
    post:
      summary: Create SCIM user (supports externalId linkage)
      responses:
        '201':
          description: SCIM user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
                  userName:
                    type: string
                  meta:
                    type: object
  /scim/v2/Users/{id}:
    get:
      summary: Get SCIM user by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM user with all attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
                  userName:
                    type: string
        '404':
          description: User not found
    put:
      summary: Replace SCIM user (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM user replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
    patch:
      summary: Patch SCIM user (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM user patched
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
    delete:
      summary: Delete SCIM user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: SCIM user deleted
  /scim/v2/Groups:
    get:
      summary: List SCIM groups
      parameters:
        - in: query
          name: startIndex
          schema: { type: integer, minimum: 1 }
        - in: query
          name: count
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: filter
          schema: { type: string }
      responses:
        '200':
          description: SCIM group list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  totalResults:
                    type: integer
                  startIndex:
                    type: integer
                  itemsPerPage:
                    type: integer
                  Resources:
                    type: array
                    items:
                      type: object
    post:
      summary: Create SCIM group (supports externalId linkage)
      responses:
        '201':
          description: SCIM group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
                  displayName:
                    type: string
  /scim/v2/Groups/{id}:
    get:
      summary: Get SCIM group by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM group with all attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
                  displayName:
                    type: string
        '404':
          description: Group not found
    put:
      summary: Replace SCIM group (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM group replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
    patch:
      summary: Patch SCIM group (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM group patched
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  id:
                    type: string
    delete:
      summary: Delete SCIM group
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: SCIM group deleted
  /.well-known/openid-configuration:
    get:
      summary: OIDC discovery document
      responses:
        '200':
          description: Discovery metadata with OIDC provider configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  userinfo_endpoint:
                    type: string
                  jwks_uri:
                    type: string
                  response_types_supported:
                    type: array
                    items:
                      type: string
                  subject_types_supported:
                    type: array
                    items:
                      type: string
                  grant_types_supported:
                    type: array
                    items:
                      type: string
  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set
      responses:
        '200':
          description: JWK Set with platform signing keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                        kid:
                          type: string
                        use:
                          type: string
                        n:
                          type: string
                        e:
                          type: string
  /oauth/authorize:
    get:
      summary: Authorization endpoint
      parameters:
        - in: query
          name: response_type
          schema:
            type: string
            enum: [code, token, "code token", "code id_token", "id_token token", "code id_token token"]
          required: true
        - in: query
          name: client_id
          schema: { type: string }
          required: true
        - in: query
          name: redirect_uri
          schema: { type: string, format: uri }
          required: true
        - in: query
          name: scope
          schema: { type: string }
          required: true
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: approval_prompt
          schema:
            type: string
            enum: [auto, force]
          description: Legacy prompt behavior control; force requires interactive consent.
      responses:
        '302':
          description: Redirect to login/consent/client redirect URI
  /oauth/token:
    post:
      summary: Token endpoint
      description: |
        Exchanges OAuth grants for tokens using the shared platform token endpoint.

        Multi-app deployments still use this same `/oauth/token` route. App context is
        derived from the client configuration and the user's effective app assignments,
        rather than from an app-specific token endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, code, client_id, client_secret, redirect_uri]
                  properties:
                    grant_type: { type: string, enum: [authorization_code] }
                    code: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                    redirect_uri: { type: string, format: uri }
                    code_verifier: { type: string }
                - type: object
                  required: [grant_type, refresh_token, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: [refresh_token] }
                    refresh_token: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                - type: object
                  required: [grant_type, client_id, client_secret]
                  description: Uses either a registered OAuth client with the client_credentials grant or an issued service identity OAuth client credential pair.
                  properties:
                    grant_type: { type: string, enum: [client_credentials] }
                    client_id: { type: string }
                    client_secret: { type: string }
                    scope: { type: string }
                - type: object
                  required: [grant_type, username, password, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: [password] }
                    username: { type: string }
                    password: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                    scope: { type: string }
                - type: object
                  required: [grant_type, device_code, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: ["urn:ietf:params:oauth:grant-type:device_code"] }
                    device_code: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                - type: object
                  required: [grant_type, assertion, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: ["urn:ietf:params:oauth:grant-type:jwt-bearer"] }
                    assertion: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                    scope: { type: string }
                - type: object
                  required: [grant_type, assertion, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: ["urn:ietf:params:oauth:grant-type:saml2-bearer"] }
                    assertion: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                    scope: { type: string }
                - type: object
                  required: [grant_type, auth_req_id, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: ["urn:openid:params:grant-type:ciba"] }
                    auth_req_id: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
      responses:
        '200':
          description: Access token and refresh token response
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                    description: OAuth access token
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    description: Token lifetime in seconds
                  refresh_token:
                    type: string
                    description: Refresh token for obtaining new access tokens
                  id_token:
                    type: string
                    description: OIDC ID token (for OIDC flows)
  /oauth/ciba/authenticate:
    post:
      summary: Start CIBA authentication request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret, login_hint]
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                login_hint:
                  type: string
                scope:
                  type: string
                binding_message:
                  type: string
                user_code:
                  type: string
      responses:
        '200':
          description: CIBA request accepted
          content:
            application/json:
              schema:
                type: object
                required: [auth_req_id, expires_in, interval]
                properties:
                  auth_req_id:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer
  /oauth/ciba/approve:
    post:
      summary: Approve or deny CIBA authentication request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_req_id, username, password, approve]
              properties:
                auth_req_id:
                  type: string
                username:
                  type: string
                password:
                  type: string
                approve:
                  type: boolean
      responses:
        '200':
          description: CIBA decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [approved, denied]
  /oauth/introspect:
    post:
      summary: Token introspection (RFC 7662)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Token to introspect
      responses:
        '200':
          description: Token status and claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  scope:
                    type: string
                  client_id:
                    type: string
                  username:
                    type: string
                  token_type:
                    type: string
                  exp:
                    type: integer
                  iat:
                    type: integer
  /oauth/token/revoke:
    post:
      summary: RFC7009 token revocation
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, client_id, client_secret]
              properties:
                token:
                  type: string
                  description: Token to revoke
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Revocation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
  /oauth/userinfo:
    get:
      summary: OIDC UserInfo endpoint
      description: |
        Returns standard OpenID Connect claims for the user backing the bearer
        access token. Profile claims (including `picture`), `email`, `roles`,
        `groups`, and flattened `permissions` are included only when the
        corresponding scope was granted on the access token. Set `?format=signed`
        (or `?response=jwt`) to receive the claims as a signed JWT instead of
        a JSON document.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [json, signed, jwt]
          description: When `signed` or `jwt`, the response is returned as `application/jwt`.
      responses:
        '200':
          description: User claims and profile information
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                    description: Subject identifier
                  preferred_username:
                    type: string
                  email:
                    type: string
                  email_verified:
                    type: boolean
                  name:
                    type: string
                  given_name:
                    type: string
                  family_name:
                    type: string
                  picture:
                    type: string
                  updated_at:
                    type: integer
                  roles:
                    type: array
                    description: Names of roles directly assigned to the user or inherited via group membership.
                    items:
                      type: string
                  groups:
                    type: array
                    description: Names of groups the user belongs to.
                    items:
                      type: string
                  permissions:
                    type: array
                    description: Flattened, de-duplicated set of permission strings granted by the user's effective roles.
                    items:
                      type: string
            application/jwt:
              schema:
                type: string
                description: Signed JWT containing the same claims when `format=signed` is requested.
        '401':
          description: Invalid or missing access token
  /oauth/device/authorize:
    post:
      summary: Start OAuth device authorization flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: Device authorization issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer
  /oauth/device/verify:
    post:
      summary: Approve or deny a device authorization user code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code, username, password]
              properties:
                user_code:
                  type: string
                username:
                  type: string
                password:
                  type: string
                approve:
                  type: boolean
      responses:
        '200':
          description: Device verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [approved, denied]
  /oauth/logout:
    get:
      summary: RP-initiated logout
      responses:
        '302':
          description: Redirect after logout
  /oauth/frontchannel-logout:
    get:
      summary: Front-channel logout
      parameters:
        - in: query
          name: iss
          schema: { type: string }
          description: Issuer identifier
        - in: query
          name: sid
          schema: { type: string }
          description: Session ID
      responses:
        '200':
          description: Logout completed
          content:
            text/html:
              schema:
                type: string
  /oauth/backchannel-logout:
    post:
      summary: Back-channel logout (OIDC RP-Initiated Logout)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
                  description: Logout token
      responses:
        '200':
          description: Session(s) revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
  /connect/register:
    post:
      summary: Dynamic client registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                app_id:
                  type: string
                  description: Optional app boundary to associate with the newly registered client.
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                    enum: [authorization_code, client_credentials, refresh_token, password, device_code, token_exchange, jwt_bearer, saml2_bearer, ciba]
                response_types:
                  type: array
                  items:
                    type: string
                    enum: [code, token, "code token", "code id_token", "id_token token", "code id_token token"]
                scope:
                  type: string
      responses:
        '201':
          description: Client registered successfully with credentials
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret, client_name]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                  client_name:
                    type: string
                  redirect_uris:
                    type: array
                    items:
                      type: string
                  grant_types:
                    type: array
                    items:
                      type: string
                  scope:
                    type: string
  /api/admin/me:
    get:
      summary: Current admin user profile
      description: |
        Returns the currently authenticated admin/portal session user along
        with their effective `roles`, `groups`, and the flattened set of
        `permissions` granted by those roles (including roles inherited via
        group membership). Use this endpoint to bootstrap the admin UI or to
        drive client-side authorization checks.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile and authorization claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  username:
                    type: string
                  givenName:
                    type: string
                  familyName:
                    type: string
                  avatarUrl:
                    type: string
                    nullable: true
                  roles:
                    type: array
                    description: Effective role names (direct + group-inherited).
                    items:
                      type: string
                  groups:
                    type: array
                    description: Group names the user belongs to.
                    items:
                      type: string
                  permissions:
                    type: array
                    description: Flattened, de-duplicated permission strings granted by the user's effective roles.
                    items:
                      type: string
        '401':
          description: No active session
  /api/admin/clients:
    get:
      summary: List OAuth clients with pagination
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of OAuth clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthClient'
                  total:
                    type: integer
    post:
      summary: Create OAuth client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirectUris, grants]
              properties:
                name:
                  type: string
                appId:
                  type: string
                  nullable: true
                redirectUris:
                  type: array
                  items:
                    type: string
                    format: uri
                allowedScopes:
                  type: array
                  items:
                    type: string
                grants:
                  type: array
                  items:
                    type: string
                requirePkce:
                  type: boolean
                resources:
                  type: array
                  items:
                    type: string
                flowIds:
                  type: array
                  items:
                    type: string
                accessTokenTtlSeconds:
                  type: integer
                  nullable: true
                  minimum: 60
                  maximum: 86400
                  description: Access token lifetime in seconds. Defaults to 900 when omitted.
                refreshTokenTtlSeconds:
                  type: integer
                  nullable: true
                  minimum: 300
                  maximum: 31536000
                  description: Refresh token lifetime in seconds. Defaults to 2592000 when omitted.
      responses:
        '201':
          description: OAuth client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
  /api/admin/users:
    get:
      summary: List users with optional search
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive partial match on username, email, given name, family name, or id
        - in: query
          name: q
          schema:
            type: string
          description: Alias for search
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: appId
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                        givenName:
                          type: string
                        familyName:
                          type: string
                        active:
                          type: boolean
                        isServiceUser:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
    post:
      summary: Create user
      description: Creates a user. Provide either password for normal creation or passwordHash for API-only migration imports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, givenName, familyName]
              properties:
                appId:
                  type: string
                appIds:
                  type: array
                  items:
                    type: string
                externalSource:
                  type: string
                externalId:
                  type: string
                isServiceUser:
                  type: boolean
                avatarUrl:
                  type: string
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
                  description: Plain password to hash and validate against password policy. Mutually exclusive with passwordHash.
                passwordHash:
                  type: string
                  description: Precomputed database password hash for migration imports. Mutually exclusive with password and stored as provided.
                givenName:
                  type: string
                familyName:
                  type: string
                customAttributes:
                  type: object
                  additionalProperties:
                    type: string
                roleIds:
                  type: array
                  items:
                    type: string
                groupIds:
                  type: array
                  items:
                    type: string
              oneOf:
                - required: [password]
                - required: [passwordHash]
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  username:
                    type: string
