                    id:
                      type: string
                    credentialId:
                      type: string
                    displayName:
                      type: string
                    transports:
                      type: array
                      items:
                        type: string
                    aaguid:
                      type: string
                      nullable: true
                    signCount:
                      type: integer
                    createdAt:
                      type: string
                      format: date-time
                    lastUsedAt:
                      type: string
                      format: date-time
                      nullable: true
        '401':
          description: No valid session
  /api/account/mfa/webauthn/register/begin:
    post:
      summary: Start WebAuthn credential registration
