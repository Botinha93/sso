        '200':
          description: Paginated list of SAML service providers
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SamlServiceProvider'
                  total:
                    type: integer
                    description: Total count of service providers
                  limit:
                    type: integer
                    description: Limit parameter used
                  offset:
                    type: integer
                    description: Offset parameter used
              example:
                items:
                  - id: "sp_uuid001"
                    entityId: "https://app.example.com"
                    acsUrl: "https://app.example.com/saml/acs"
                    sloUrl: "https://app.example.com/saml/slo"
                    signingCertificate: "-----BEGIN CERTIFICATE-----..."
                    encryptionCertificate: null
                    nameIdFormat: "persistent"
                    enabled: true
                    createdAt: "2026-04-01T10:00:00Z"
                    updatedAt: "2026-04-27T09:00:00Z"
                total: 5
                limit: 50
                offset: 0
    post:
      summary: Create SAML service provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityId, acsUrl, signingCertificate]
              properties:
                entityId:
                  type: string
                  description: SAML service provider entity ID (unique identifier)
                acsUrl:
                  type: string
                  format: uri
                  description: Assertion Consumer Service URL
                sloUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: Single Logout Service URL (optional)
                signingCertificate:
                  type: string
                  description: X.509 certificate for signature verification (PEM format)
                encryptionCertificate:
                  type: string
                  nullable: true
                  description: X.509 certificate for response encryption (optional)
                nameIdFormat:
                  type: string
                  enum: [persistent, transient, emailAddress]
                  default: persistent
                enabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Service provider created successfully
