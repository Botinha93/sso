        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [active, inactive, suspended]
                allowedScopes:
                  type: array
                  items:
                    type: string
                allowedAudiences:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated service identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceIdentity'
        '404':
          description: Service identity not found
    delete:
      summary: Delete service identity
      tags: [Workload Identity]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Service identity deleted successfully
        '404':
          description: Service identity not found

  /api/admin/service-identities/{id}/credentials:
    post:
      summary: Issue OAuth client credentials for a service identity
      tags: [Workload Identity]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  description: Number of days until credential expires (optional)
      responses:
        '201':
          description: OAuth client credential pair issued with plainClientSecret (shown once only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedServiceIdentityCredential'
              example:
                credential:
                  id: "cred_uuid112"
                  serviceIdentityId: "si_uuid123"
                  clientId: "svc_backend_worker"
                  expiresAt: "2027-04-20T10:00:00Z"
                  revokedAt: null
                  rotatedFromId: null
                  lastUsedAt: null
                  createdAt: "2026-04-27T09:00:00Z"
                plainClientSecret: "se4_c1i3nt_s3cr3t_abc123xyz789"
        '404':
          description: Service identity not found

  /api/admin/service-identities/{id}/credentials/rotate:
    post:
      summary: Rotate OAuth client credentials (issue new + revoke old)
      tags: [Workload Identity]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialId]
              properties:
                credentialId:
                  type: string
                  description: Credential ID to rotate (revoke)
                expiresInDays:
                  type: integer
                  minimum: 1
                  description: Number of days until new credential expires (optional)
      responses:
        '201':
          description: New OAuth client credential pair issued (old one revoked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedServiceIdentityCredential'
              example:
                credential:
                  id: "cred_uuid113"
                  serviceIdentityId: "si_uuid123"
                  clientId: "svc_backend_worker"
                  expiresAt: "2027-04-27T09:00:00Z"
                  revokedAt: null
                  rotatedFromId: "cred_uuid112"
                  lastUsedAt: null
                  createdAt: "2026-04-27T09:30:00Z"
                plainClientSecret: "se4_n3w_c1i3nt_s3cr3t_def456uvw012"
        '404':
          description: Service identity or credential not found

  /api/admin/service-identities/{id}/credentials/{credentialId}:
    delete:
      summary: Revoke a credential
      tags: [Workload Identity]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: credentialId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Credential revoked successfully
        '404':
          description: Service identity or credential not found

  /api/admin/service-identities/{id}/usage:
    get:
      summary: Get credential usage telemetry for a service identity
      tags: [Workload Identity]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  serviceIdentityId:
                    type: string
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        credentialId:
                          type: string
                        status:
                          type: string
                          enum: [active, revoked, expired]
