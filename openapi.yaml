  /api/admin/service-identities:
    get:
      summary: List service identities
      tags: [Workload Identity]
      responses:
        '200':
          description: List of service identities with all details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceIdentity'
              example:
                - id: "si_uuid123"
                  name: "backend-api"
                  description: "Service identity for backend API workload"
                  ownerId: "user_uuid456"
                  appId: "app_uuid789"
                  status: "active"
                  allowedScopes: ["api:read", "api:write"]
                  allowedAudiences: ["api.example.com"]
                  metadata: { "team": "platform", "env": "prod" }
                  createdAt: "2026-04-27T10:00:00Z"
                  updatedAt: "2026-04-27T10:00:00Z"
    post:
      summary: Create a service identity
      tags: [Workload Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Human-readable name
                description:
                  type: string
                  description: Optional description
                status:
                  type: string
                  enum: [active, inactive, suspended]
                  default: active
                  description: Initial status
                allowedScopes:
                  type: array
                  items:
                    type: string
                  description: List of allowed OAuth scopes
                allowedAudiences:
                  type: array
                  items:
                    type: string
                  description: List of allowed JWT audiences
                ownerId:
                  type: string
                  description: Optional owner user ID
                metadata:
                  type: object
                  additionalProperties: true
                  description: Optional custom metadata
      responses:
        '201':
          description: Service identity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceIdentity'
              example:
                id: "si_uuid123"
                name: "backend-api"
                description: "Service identity for backend API workload"
                ownerId: "user_uuid456"
                appId: null
                status: "active"
                allowedScopes: ["api:read", "api:write"]
                allowedAudiences: ["api.example.com"]
                metadata: { "team": "platform" }
                createdAt: "2026-04-27T10:00:00Z"
                updatedAt: "2026-04-27T10:00:00Z"

  /api/admin/service-identities/{id}:
    get:
      summary: Get service identity with credentials
      tags: [Workload Identity]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service identity with all credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceIdentityWithCredentials'
              example:
                id: "si_uuid123"
                name: "backend-api"
                description: "Service identity for backend API workload"
                ownerId: "user_uuid456"
                appId: "app_uuid789"
                status: "active"
                allowedScopes: ["api:read", "api:write"]
                allowedAudiences: ["api.example.com"]
                metadata: { "team": "platform" }
                credentials:
                  - id: "cred_uuid111"
                    serviceIdentityId: "si_uuid123"
                    clientId: "si_uuid123"
                    expiresAt: null
                    revokedAt: null
                    rotatedFromId: null
                    lastUsedAt: "2026-04-26T15:30:00Z"
                    createdAt: "2026-04-20T10:00:00Z"
                  - id: "cred_uuid112"
                    serviceIdentityId: "si_uuid123"
                    clientId: "si_uuid123"
                    expiresAt: "2027-04-20T10:00:00Z"
                    revokedAt: null
                    rotatedFromId: "cred_uuid111"
                    lastUsedAt: null
                    createdAt: "2026-04-27T09:00:00Z"
                createdAt: "2026-04-20T10:00:00Z"
                updatedAt: "2026-04-27T09:00:00Z"
