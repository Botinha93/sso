                items:
                  $ref: '#/components/schemas/ConnectorRun'
              example:
                - id: "run_uuid999"
                  connectorId: "conn_uuid001"
                  status: "succeeded"
                  startedAt: "2026-04-27T06:00:00Z"
                  completedAt: "2026-04-27T06:15:00Z"
                  error: null
                  usersCreated: 5
                  usersUpdated: 12
                  usersDeleted: 0
                  groupsCreated: 1
                  groupsUpdated: 3
                  groupsDeleted: 0
                  createdAt: "2026-04-27T06:00:00Z"
        '404':
          description: Connector not found

  /api/admin/connectors/{id}/mappings:
    get:
      summary: List all attribute mappings for connector
      tags: [Connectors]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of field mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorMapping'
              example:
                - id: "map_uuid001"
                  connectorId: "conn_uuid001"
                  sourceField: "givenName"
                  targetField: "givenName"
                  transform: null
                  createdAt: "2026-04-01T10:00:00Z"
                - id: "map_uuid002"
                  connectorId: "conn_uuid001"
                  sourceField: "mail"
                  targetField: "email"
                  transform: "lowercase"
                  createdAt: "2026-04-01T10:00:00Z"
        '404':
          description: Connector not found
    post:
      summary: Create attribute mapping for connector
      tags: [Connectors]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceField, targetField]
              properties:
                sourceField:
                  type: string
                  description: Source field from connector
                targetField:
                  type: string
                  description: Target user/group attribute
                transform:
                  type: string
                  description: Optional transformation expression
      responses:
        '201':
          description: Mapping created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorMapping'
              example:
                id: "map_uuid003"
                connectorId: "conn_uuid001"
                sourceField: "telephoneNumber"
                targetField: "phone"
                transform: null
                createdAt: "2026-04-27T10:00:00Z"
        '404':
          description: Connector not found

  /api/admin/connectors/{connectorId}/mappings/{mappingId}:
    delete:
      summary: Delete attribute mapping
      tags: [Connectors]
      parameters:
        - in: path
          name: connectorId
          required: true
          schema:
            type: string
        - in: path
          name: mappingId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Mapping deleted successfully
        '404':
          description: Connector or mapping not found

  /api/admin/settings/test-email:
    post:
      summary: Send a test email using current instance settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  format: email
                subject:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Test email result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/admin/settings/database/test:
    post:
      summary: Test external database connectivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, externalDatabaseUrl]
              properties:
                provider:
                  type: string
                  enum: [postgresql, mysql]
                externalDatabaseUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
  /api/admin/settings/database/migrate:
    post:
      summary: Migrate data from SQLite to external database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, externalDatabaseUrl]
              properties:
                provider:
                  type: string
                  enum: [postgresql, mysql]
                externalDatabaseUrl:
                  type: string
                  format: uri
                sqlitePath:
                  type: string
      responses:
        '200':
          description: Migration result
          content:
            application/json:
              schema:
                type: object
  /api/admin/apps/{id}/image:
    post:
      summary: Upload application image
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl:
                    type: string
  /api/admin/plugins:
    get:
      summary: List uploaded plugins
      responses:
        '200':
          description: Plugin list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
    post:
      summary: Upload a plugin bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, bundleBase64]
              properties:
                manifest:
                  type: object
                bundleBase64:
                  type: string
                activate:
                  type: boolean
      responses:
        '201':
          description: Plugin uploaded
          content:
            application/json:
              schema:
                type: object
  /api/admin/plugins/validate:
    post:
      summary: Validate plugin manifest and optional bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest:
                  type: object
                bundleBase64:
                  type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
  /api/admin/plugins/{id}:
    delete:
      summary: Remove an uploaded plugin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Plugin removed

  /api/admin/metrics/auth:
    get:
      summary: Query authentication metric rollups
      tags: [Connectors]
      parameters:
        - in: query
          name: startHour
          required: false
          schema:
            type: string
        - in: query
          name: endHour
          required: false
          schema:
            type: string
        - in: query
          name: event
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Authentication metric rollups with timestamps and event counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    event:
                      type: string
                    count:
                      type: integer
                    successCount:
                      type: integer
                    failureCount:
                      type: integer

  /oauth/token/exchange:
    post:
      summary: RFC 8693 Token Exchange
      tags: [OAuth2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, subject_token, subject_token_type]
              properties:
                grant_type:
                  type: string
                  enum: ['urn:ietf:params:oauth:grant-type:token-exchange']
                subject_token:
                  type: string
                subject_token_type:
                  type: string
                audience:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: Exchanged access token for target audience
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                  scope:
                    type: string

components:
  schemas:
    AuthenticationStage:
      type: object
      required: [type, required, order]
      properties:
        type:
          type: string
          enum:
            - password
            - federation
            - consent
            - mfa_totp
            - mfa_webauthn
            - risk_check
            - identification
            - email_verification
            - captcha
            - prompt
            - user_write
            - user_login
            - user_logout
        required:
          type: boolean
        order:
          type: integer
          minimum: 1
    AuthenticationFlowBase:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        designation:
          type: string
          enum:
            - authentication
            - authorization
            - enrollment
            - invalidation
            - recovery
            - stage_configuration
            - unenrollment
        enabled:
          type: boolean
        grantTypes:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - client_credentials
              - refresh_token
              - password
              - device_code
        stages:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationStage'
    AuthenticationFlow:
      allOf:
        - $ref: '#/components/schemas/AuthenticationFlowBase'
        - type: object
          required: [id, name, description, designation, enabled, grantTypes, stages, createdAt, updatedAt]
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AuthenticationFlowCreate:
      allOf:
        - $ref: '#/components/schemas/AuthenticationFlowBase'
        - type: object
          required: [name, description, grantTypes, stages]
    AuthenticationFlowUpdate:
      allOf:
        - $ref: '#/components/schemas/AuthenticationFlowBase'
    SamlServiceProvider:
      type: object
      properties:
        id:
          type: string
          description: Service provider ID
        entityId:
          type: string
          description: SAML entity ID
        acsUrl:
          type: string
          format: uri
          description: Assertion Consumer Service URL
        sloUrl:
          type: string
          format: uri
          nullable: true
          description: Single Logout Service URL
        signingCertificate:
          type: string
          description: X.509 certificate for signature verification
        encryptionCertificate:
          type: string
          nullable: true
          description: X.509 certificate for response encryption
        nameIdFormat:
          type: string
          enum: [persistent, transient, emailAddress]
          description: NameID format for assertions
        enabled:
          type: boolean
          description: Whether the service provider is enabled
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
    SamlAssertionAudit:
      type: object
      properties:
        id:
          type: string
          description: Audit record ID
        spId:
          type: string
          description: Service provider ID that processed the assertion
        requestId:
          type: string
          description: Upstream request ID correlated to this response
        responseId:
          type: string
          description: SAML response ID
        subject:
          type: string
          description: Assertion subject/NameID
        audience:
          type: string
          description: Intended assertion audience
        assertionId:
          type: string
          description: SAML assertion ID
        issueInstant:
          type: string
          format: date-time
        notOnOrAfter:
          type: string
          format: date-time
        destinationUrl:
          type: string
          format: uri
        statusCode:
          type: string
          description: SAML status code URN from assertion processing
        createdAt:
          type: string
          format: date-time
    ServiceIdentity:
      type: object
      required: [id, name, status, allowedScopes, allowedAudiences, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Unique service identity identifier
        name:
          type: string
          description: Human-readable name of the service identity
        description:
          type: string
          nullable: true
          description: Optional description
        ownerId:
          type: string
          nullable: true
          description: Owner user ID
        appId:
          type: string
          nullable: true
          description: Associated app ID
        status:
          type: string
          enum: [active, inactive, suspended]
          description: Current status of the service identity
        allowedScopes:
          type: array
          items:
            type: string
          description: List of OAuth scopes this service identity can request
        allowedAudiences:
          type: array
          items:
            type: string
          description: List of allowed audience values for token validation
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Custom metadata object
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    ServiceIdentityWithCredentials:
      allOf:
        - $ref: '#/components/schemas/ServiceIdentity'
        - type: object
          properties:
            credentials:
              type: array
              items:
                $ref: '#/components/schemas/ServiceIdentityCredential'
              description: List of active credentials
    ServiceIdentityCredential:
      type: object
      required: [id, serviceIdentityId, clientId, createdAt]
      properties:
        id:
          type: string
          description: Unique credential identifier
        serviceIdentityId:
          type: string
          description: Associated service identity ID
        clientId:
          type: string
          description: OAuth client_id issued for service identity client_credentials token requests
        clientSecretHash:
          type: string
          description: Hashed client secret (not exposed in responses)
        plainClientSecret:
          type: string
          description: Plain OAuth client_secret (shown only once on creation/rotation)
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiration time if set
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: Revocation time if revoked
        rotatedFromId:
          type: string
          nullable: true
          description: Previous credential ID if this was rotated from another
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Last usage timestamp
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    IssuedServiceIdentityCredential:
      type: object
      required: [credential, plainClientSecret]
      properties:
        credential:
          $ref: '#/components/schemas/ServiceIdentityCredential'
        plainClientSecret:
          type: string
          description: One-time OAuth client_secret for grant_type=client_credentials token requests
    Connector:
      type: object
      required: [id, name, type, status, config, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Unique connector identifier
        name:
          type: string
          description: Human-readable connector name
        type:
          type: string
          enum: [ldap, scim, csv, sql, custom]
          description: Connector type
        status:
          type: string
          enum: [active, inactive, error]
          description: Current operational status
        config:
          type: object
          additionalProperties: true
          description: Connector-specific configuration
        schedule:
          type: string
          nullable: true
          description: Cron expression for scheduled syncs
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last successful sync
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    ConnectorRun:
      type: object
      required: [id, connectorId, status, createdAt]
      properties:
        id:
          type: string
          description: Unique run identifier
        connectorId:
          type: string
          description: Associated connector ID
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
          description: Current run status
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when run started
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when run completed
        error:
          type: string
          nullable: true
          description: Error message if run failed
        usersCreated:
          type: integer
          description: Number of users created
        usersUpdated:
          type: integer
          description: Number of users updated
        usersDeleted:
          type: integer
          description: Number of users deleted
        groupsCreated:
          type: integer
          description: Number of groups created
        groupsUpdated:
          type: integer
          description: Number of groups updated
        groupsDeleted:
          type: integer
          description: Number of groups deleted
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    ConnectorMapping:
      type: object
      required: [id, connectorId, sourceField, targetField]
      properties:
        id:
          type: string
          description: Unique mapping identifier
        connectorId:
          type: string
          description: Associated connector ID
        sourceField:
          type: string
          description: Source field name from connector
        targetField:
          type: string
          description: Target user/group attribute
        transform:
          type: string
          nullable: true
          description: Optional transformation expression
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    AccessRequest:
      type: object
      required: [id, requesterId, subjectUserId, entitlementType, status, createdAt]
      properties:
        id:
          type: string
          description: Unique request identifier
        requesterId:
          type: string
          description: User ID who created the request
        subjectUserId:
          type: string
          description: User ID requesting access
        entitlementType:
          type: string
          description: Type of entitlement (e.g., role, group)
        entitlementValue:
          type: string
          description: Value of the entitlement being requested
        status:
          type: string
          enum: [pending, approved, rejected, expired, cancelled]
          description: Current request status
        justification:
          type: string
          description: Reason for the access request
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiration time for the requested access
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    AccessReviewCampaign:
      type: object
      required: [id, name, status, createdByUserId, createdAt]
      properties:
        id:
          type: string
          description: Unique campaign identifier
        name:
          type: string
          description: Campaign name
        description:
          type: string
          nullable: true
          description: Optional campaign description
        status:
          type: string
          enum: [active, closed]
          description: Campaign status
        createdByUserId:
          type: string
          description: User ID who created the campaign
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: Optional due date for reviews
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    AccessReviewItem:
      type: object
      required: [id, campaignId, subjectUserId, entitlementType, entitlementValue, currentState, createdAt]
      properties:
        id:
          type: string
          description: Unique review item identifier
        campaignId:
          type: string
          description: Associated campaign ID
        subjectUserId:
          type: string
          description: User being reviewed
        entitlementType:
          type: string
          enum: [role, group]
          description: Type of entitlement
        entitlementValue:
          type: string
          description: Entitlement identifier
        currentState:
          type: string
          enum: [granted]
          description: Current state of the entitlement
        decision:
          type: string
          enum: [certified, revoked]
          nullable: true
          description: Reviewer decision
        decidedByUserId:
          type: string
          nullable: true
          description: User ID of reviewer
        decisionRationale:
          type: string
          nullable: true
          description: Explanation for the decision
        decidedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of decision
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    ElevationRequest:
      type: object
      required: [id, correlationId, requesterId, justification, resource, action, status, createdAt]
      properties:
        id:
          type: string
          description: Unique request identifier
        correlationId:
          type: string
          description: Correlation ID for audit trail stitching
        requesterId:
          type: string
          description: User ID requesting elevation
        justification:
          type: string
          description: Justification for the elevation request
        resource:
          type: string
          description: Resource requiring privileged access
        action:
          type: string
          description: Action requiring elevation
        status:
          type: string
          enum: [pending, approved, active, revoked, expired]
          description: Current request status
        approvedByUserId:
          type: string
          nullable: true
          description: User ID of approver
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: Approval timestamp
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: Activation timestamp
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: Revocation timestamp
        revokedByUserId:
          type: string
          nullable: true
          description: User ID who revoked
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    ElevationSession:
      type: object
      required: [id, correlationId, elevationRequestId, requesterId, resource, action, status, startedAt, expiresAt, createdAt]
      properties:
        id:
          type: string
          description: Unique session identifier
        correlationId:
          type: string
          description: Correlation ID for audit stitching
        elevationRequestId:
          type: string
          description: Associated elevation request ID
        requesterId:
          type: string
          description: User ID of elevated session owner
        resource:
          type: string
          description: Resource with elevation
        action:
          type: string
          description: Elevated action
        status:
          type: string
          enum: [active, revoked, expired]
          description: Current session status
        startedAt:
          type: string
          format: date-time
          description: Session start timestamp
        expiresAt:
          type: string
          format: date-time
          description: Hard expiry timestamp
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: Session end timestamp
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    OAuthClient:
      type: object
      required: [id, name, secret, redirectUris, allowedScopes, grants, createdAt]
      properties:
        id:
          type: string
          description: Unique client identifier
        appId:
          type: string
          nullable: true
          description: Associated app ID
        name:
          type: string
          description: Human-readable client name
        secret:
          type: string
          description: Client secret (shown once on creation)
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: Authorized redirect URIs
        allowedScopes:
          type: array
          items:
            type: string
          description: Allowed OAuth scopes
        grants:
          type: array
          items:
            type: string
          description: Allowed grant types
        requirePkce:
          type: boolean
          description: Whether PKCE is required
        resources:
          type: array
          items:
            type: string
          description: Associated resources
        flowIds:
          type: array
          items:
            type: string
          description: Associated authentication flow IDs
        accessTokenTtlSeconds:
          type: integer
          nullable: true
          minimum: 60
          maximum: 86400
          description: Lifetime of access tokens issued for this client (seconds). Null indicates the system default.
        refreshTokenTtlSeconds:
          type: integer
          nullable: true
          minimum: 300
          maximum: 31536000
          description: Lifetime of refresh tokens issued for this client (seconds). Null indicates the system default.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
    BreakGlassElevationResponse:
      type: object
      required: [breakGlassId, request, session]
      properties:
        breakGlassId:
          type: string
          description: Unique break-glass event identifier
        request:
          type: object
          required: [id, status, correlationId, resource, action, expiresAt]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [active]
            correlationId:
              type: string
            resource:
              type: string
            action:
              type: string
            expiresAt:
              type: string
              format: date-time
        session:
          type: object
          required: [id, status, startedAt, expiresAt]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [active]
            startedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
  securitySchemes:
    bearerAuth:
