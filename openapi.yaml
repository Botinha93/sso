                    createdAt: "2026-04-27T09:00:00Z"
                  - credentialId: "cred_uuid113"
                    status: "active"
                    lastUsedAt: null
                    usageCount: 0
                    createdAt: "2026-04-27T09:30:00Z"
        '404':
          description: Service identity not found

