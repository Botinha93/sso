      responses:
        '200':
          description: Expiration processing summary with count of expired items
          content:
            application/json:
              schema:
                type: object
                required: [expired]
                properties:
                  expired:
                    type: integer
                    description: Number of requests/sessions expired
                  revokedSessions:
                    type: integer
                    description: Number of sessions that were revoked
              example:
                expired: 5
                revokedSessions: 3
  /api/admin/elevations/check:
    post:
      summary: Check if user has active elevation for resource/action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, action]
              properties:
                resource:
                  type: string
                  description: Resource to check
                action:
                  type: string
                  description: Action to check
      responses:
        '200':
          description: Access decision with active session details if allowed
          content:
            application/json:
              schema:
                type: object
                required: [allowed, hasSession]
                properties:
                  allowed:
                    type: boolean
                    description: Whether user has active elevation
                  hasSession:
                    type: boolean
                    description: Whether an active session exists
                  sessionId:
                    type: string
                    nullable: true
                    description: Active session ID if exists
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Session expiration time
              example:
                allowed: true
                hasSession: true
                sessionId: "sess_uuid001"
                expiresAt: "2026-04-27T12:00:00Z"
  /api/admin/elevations/break-glass:
    post:
      summary: Activate emergency break-glass elevation
      description: Allows admins to bypass approval workflow for emergency scenarios. Requires strong justification and creates special audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, action, reason]
              properties:
                resource:
                  type: string
                  description: Resource requiring privileged access
                action:
                  type: string
                  description: Action requiring elevation
                reason:
                  type: string
                  minLength: 10
                  description: Emergency justification (minimum 10 characters)
                requesterId:
                  type: string
                  nullable: true
                  description: User ID for elevation (defaults to current admin)
                durationMinutes:
                  type: number
                  minimum: 1
                  maximum: 120
                  default: 30
                  description: Duration of emergency elevation (default 30 minutes, max 120)
      responses:
        '201':
          description: Emergency elevation session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakGlassElevationResponse'
              example:
                breakGlassId: "bg_emergency_001"
                request:
                  id: "elev_uuid999"
                  status: "active"
                  correlationId: "corr_bg_audit_xyz"
                  resource: "production:database"
                  action: "admin:reset"
                  expiresAt: "2026-04-27T11:00:00Z"
                session:
                  id: "sess_uuid999"
                  status: "active"
                  startedAt: "2026-04-27T10:00:00Z"
                  expiresAt: "2026-04-27T11:00:00Z"
                  request:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum: [active]
                      correlationId:
                        type: string
                      resource:
                        type: string
                      action:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum: [active]
                      startedAt:
                        type: string
                        format: date-time
                      expiresAt:
                        type: string
                        format: date-time
