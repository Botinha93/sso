              type: object
              properties:
                displayName:
                  type: string
                  description: Human-readable name for the credential
      responses:
        '200':
          description: Registration challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrationId:
                    type: string
                  challenge:
                    type: string
                    format: base64
                  rp:
                    type: object
                    properties:
                      name:
                        type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      displayName:
                        type: string
                  pubKeyCredParams:
                    type: array
                    items:
                      type: object
        '401':
          description: No valid session
  /api/account/mfa/webauthn/register/finish:
    post:
      summary: Complete WebAuthn credential registration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationId, credentialId, publicKey]
              properties:
                registrationId:
                  type: string
                credentialId:
                  type: string
                  format: base64
                publicKey:
                  type: string
                  format: base64
                transports:
                  type: array
                  items:
                    type: string
                  description: Transport hints (usb, nfc, ble, internal)
                aaguid:
                  type: string
                  nullable: true
                signCount:
                  type: integer
                  minimum: 0
                displayName:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Credential registered and stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentialId:
                    type: string
                  displayName:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        '400':
