openapi: 3.0.3
info:
  title: NexusID API
  version: 0.1.0
  description: OAuth2/OIDC, admin APIs, and user portal APIs.
servers:
  - url: http://127.0.0.1:4000
paths:
  /scim/v2/ServiceProviderConfig:
    get:
      summary: SCIM service provider capabilities
      responses:
        '200':
          description: Service provider configuration
  /scim/v2/Schemas:
    get:
      summary: List SCIM schemas
      responses:
        '200':
          description: SCIM schema list
  /scim/v2/ResourceTypes:
    get:
      summary: List SCIM resource types
      responses:
        '200':
          description: SCIM resource type list
  /scim/v2/Users:
    get:
      summary: List SCIM users
      parameters:
        - in: query
          name: startIndex
          schema: { type: integer, minimum: 1 }
        - in: query
          name: count
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: filter
          schema: { type: string }
      responses:
        '200':
          description: SCIM user list
    post:
      summary: Create SCIM user (supports externalId linkage)
      responses:
        '201':
          description: SCIM user created
  /scim/v2/Users/{id}:
    get:
      summary: Get SCIM user by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM user
        '404':
          description: User not found
    put:
      summary: Replace SCIM user (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM user replaced
    patch:
      summary: Patch SCIM user (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM user patched
    delete:
      summary: Delete SCIM user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: SCIM user deleted
  /scim/v2/Groups:
    get:
      summary: List SCIM groups
      parameters:
        - in: query
          name: startIndex
          schema: { type: integer, minimum: 1 }
        - in: query
          name: count
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: filter
          schema: { type: string }
      responses:
        '200':
          description: SCIM group list
    post:
      summary: Create SCIM group (supports externalId linkage)
      responses:
        '201':
          description: SCIM group created
  /scim/v2/Groups/{id}:
    get:
      summary: Get SCIM group by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM group
        '404':
          description: Group not found
    put:
      summary: Replace SCIM group (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM group replaced
    patch:
      summary: Patch SCIM group (supports externalId linkage)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SCIM group patched
    delete:
      summary: Delete SCIM group
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: SCIM group deleted
  /.well-known/openid-configuration:
    get:
      summary: OIDC discovery document
      responses:
        '200':
          description: Discovery metadata
  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set
      responses:
        '200':
          description: JWK keys
  /oauth/authorize:
    get:
      summary: Authorization endpoint
      parameters:
        - in: query
          name: response_type
          schema:
            type: string
            enum: [code, token]
          required: true
        - in: query
          name: client_id
          schema: { type: string }
          required: true
        - in: query
          name: redirect_uri
          schema: { type: string, format: uri }
          required: true
        - in: query
          name: scope
          schema: { type: string }
          required: true
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: approval_prompt
          schema:
            type: string
            enum: [auto, force]
          description: Legacy prompt behavior control; force requires interactive consent.
      responses:
        '302':
          description: Redirect to login/consent/client redirect URI
  /oauth/token:
    post:
      summary: Token endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, code, client_id, client_secret, redirect_uri]
                  properties:
                    grant_type: { type: string, enum: [authorization_code] }
                    code: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                    redirect_uri: { type: string, format: uri }
                    code_verifier: { type: string }
                - type: object
                  required: [grant_type, refresh_token, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: [refresh_token] }
                    refresh_token: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                - type: object
                  required: [grant_type, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: [client_credentials] }
                    client_id: { type: string }
                    client_secret: { type: string }
                    scope: { type: string }
                - type: object
                  required: [grant_type, username, password, client_id, client_secret]
                  properties:
                    grant_type: { type: string, enum: [password] }
                    username: { type: string }
                    password: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                    scope: { type: string }
      responses:
        '200':
          description: Token response
  /oauth/introspect:
    post:
      summary: Token introspection
      responses:
        '200':
          description: Token status
  /oauth/token/revoke:
    post:
      summary: RFC7009 token revocation
      responses:
        '200':
          description: Revocation accepted
  /oauth/userinfo:
    get:
      summary: OIDC UserInfo endpoint
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User claims
        '401':
          description: Invalid token
  /oauth/logout:
    get:
      summary: RP-initiated logout
      responses:
        '302':
          description: Redirect after logout
  /oauth/frontchannel-logout:
    get:
      summary: Front-channel logout
      responses:
        '200':
          description: Logout completed
  /oauth/backchannel-logout:
    post:
      summary: Back-channel logout
      responses:
        '200':
          description: Session(s) revoked
  /connect/register:
    post:
      summary: Dynamic client registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                app_id:
                  type: string
                  description: Optional app boundary to associate with the newly registered client.
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                    enum: [authorization_code, client_credentials, refresh_token, password, device_code]
                response_types:
                  type: array
                  items:
                    type: string
                    enum: [code, token]
                scope:
                  type: string
      responses:
        '201':
          description: Registered client metadata
  /api/admin/clients:
    get:
      summary: List OAuth clients
      responses:
        '200':
          description: Clients list
    post:
      summary: Create OAuth client
      responses:
        '201':
          description: Client created
  /api/admin/users:
    get:
      summary: List users
      responses:
        '200':
          description: Users list
  /api/admin/provisioning/tokens:
    get:
      summary: List SCIM provisioning tokens
      responses:
        '200':
          description: SCIM token list
    post:
      summary: Create SCIM provisioning token
      responses:
        '201':
          description: SCIM token created
  /api/admin/provisioning/tokens/{id}:
    delete:
      summary: Revoke SCIM provisioning token
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: SCIM token revoked
  /api/admin/provisioning/mappings:
    get:
      summary: List provisioning attribute mappings
      responses:
        '200':
          description: Provisioning mapping list
    post:
      summary: Create provisioning attribute mapping (optional transform expression)
      responses:
        '201':
          description: Provisioning mapping created
  /api/admin/provisioning/mappings/{id}:
    delete:
      summary: Delete provisioning attribute mapping
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Provisioning mapping deleted
  /api/admin/provisioning/jobs:
    get:
      summary: List provisioning job history
      responses:
        '200':
          description: Provisioning job list
  /api/admin/provisioning/deprovisioning-queue:
    get:
      summary: List deprovisioning queue tasks
      responses:
        '200':
          description: Deprovisioning queue list
  /api/admin/provisioning/jobs/reconcile:
    post:
      summary: Run provisioning reconciliation job with drift reporting
      responses:
        '202':
          description: Reconciliation job accepted
  /api/admin/access-requests:
    get:
      summary: List access governance requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, expired, cancelled]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Access request list
    post:
      summary: Create access governance request
      responses:
        '201':
          description: Access request created
  /api/admin/access-requests/{id}/approve:
    post:
      summary: Approve access governance request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Access request approved
  /api/admin/access-requests/{id}/reject:
    post:
      summary: Reject access governance request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Access request rejected
  /api/admin/access-requests/process-expirations:
    post:
      summary: Process expired approved access requests and revoke granted assignments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
      responses:
        '200':
          description: Expiration processing summary
  /api/admin/authentication/flows:
    get:
      summary: List authentication flows
      responses:
        '200':
          description: Authentication flow list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticationFlow'
    post:
      summary: Create authentication flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationFlowCreate'
      responses:
        '201':
          description: Authentication flow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFlow'
  /api/admin/authentication/flows/{id}:
    put:
      summary: Update authentication flow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationFlowUpdate'
      responses:
        '200':
          description: Authentication flow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFlow'
    delete:
      summary: Delete authentication flow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Authentication flow deleted
  /api/admin/policies/evaluate:
    post:
      summary: Simulate policy decision for authorization-style checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, resource, action]
              properties:
                userId:
                  type: string
                resource:
                  type: string
                action:
                  type: string
                decisionStrategy:
                  type: string
                  enum: [deny_overrides, allow_overrides, first_applicable]
                tenantId:
                  type: string
                clientId:
                  type: string
                ip:
                  type: string
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Decision result and per-policy outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisionStrategy:
                    type: string
                    enum: [deny_overrides, allow_overrides, first_applicable]
                  allow:
                    type: boolean
                  deniedBy:
                    type: array
                    items:
                      type: string
                  decisions:
                    type: array
                    items:
                      type: object
                      properties:
                        policyId:
                          type: string
                        key:
                          type: string
                        name:
                          type: string
                        effect:
                          type: string
                          enum: [allow, deny]
                        priority:
                          type: integer
                        applied:
                          type: boolean
                        allow:
                          type: boolean
                        message:
                          type: string
  /api/admin/policies/decisions:
    get:
      summary: List recent policy decision evaluations
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Recent policy decision evaluations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    actorId:
                      type: string
                    clientId:
                      type: string
                    ip:
                      type: string
                    resource:
                      type: string
                    action:
                      type: string
                    allow:
                      type: boolean
                    deniedBy:
                      type: array
                      items:
                        type: string
                    context:
                      type: object
                      additionalProperties: true
  /api/admin/authorization/check:
    post:
      summary: Evaluate authorization decision for a user/resource/action request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, resource, action]
              properties:
                userId:
                  type: string
                resource:
                  type: string
                action:
                  type: string
                decisionStrategy:
                  type: string
                  enum: [deny_overrides, allow_overrides, first_applicable]
                tenantId:
                  type: string
                clientId:
                  type: string
                ip:
                  type: string
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Authorization decision result
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisionStrategy:
                    type: string
                    enum: [deny_overrides, allow_overrides, first_applicable]
                  allow:
                    type: boolean
                  deniedBy:
                    type: array
                    items:
                      type: string
                  decisions:
                    type: array
                    items:
                      type: object
                      properties:
                        policyId:
                          type: string
                        key:
                          type: string
                        name:
                          type: string
                        effect:
                          type: string
                          enum: [allow, deny]
                        priority:
                          type: integer
                        applied:
                          type: boolean
                        allow:
                          type: boolean
                        message:
                          type: string
  /api/portal/me:
    get:
      summary: Current portal user profile
      responses:
        '200':
          description: User profile and apps
components:
  schemas:
    AuthenticationStage:
      type: object
      required: [type, required, order]
      properties:
        type:
          type: string
          enum:
            - password
            - federation
            - consent
            - mfa_totp
            - risk_check
            - identification
            - email_verification
            - captcha
            - prompt
            - user_write
            - user_login
            - user_logout
        required:
          type: boolean
        order:
          type: integer
          minimum: 1
    AuthenticationFlowBase:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        designation:
          type: string
          enum:
            - authentication
            - authorization
            - enrollment
            - invalidation
            - recovery
            - stage_configuration
            - unenrollment
        enabled:
          type: boolean
        grantTypes:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - client_credentials
              - refresh_token
              - password
              - device_code
        stages:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationStage'
    AuthenticationFlow:
      allOf:
        - $ref: '#/components/schemas/AuthenticationFlowBase'
        - type: object
          required: [id, name, description, designation, enabled, grantTypes, stages, createdAt, updatedAt]
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AuthenticationFlowCreate:
      allOf:
        - $ref: '#/components/schemas/AuthenticationFlowBase'
        - type: object
          required: [name, description, grantTypes, stages]
    AuthenticationFlowUpdate:
      allOf:
        - $ref: '#/components/schemas/AuthenticationFlowBase'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
