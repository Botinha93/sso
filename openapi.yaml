              schema:
                type: object
                properties:
                  groupIds:
                    type: array
                    items:
                      type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
        '404':
          description: User not found
  /api/admin/users/{id}/roles:
    get:
      summary: List a user's effective roles (direct + inherited via groups)
      description: |
        Returns the effective role records for the user with each role's
        permissions inlined. Effective means direct assignments PLUS roles
        inherited through group membership.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User's effective roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roleIds:
                    type: array
                    items:
                      type: string
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        scope:
                          type: string
                          enum: [platform, tenant]
                        appId:
                          type: string
                          nullable: true
                        permissions:
                          type: array
                          items:
                            type: string
        '404':
          description: User not found
  /api/admin/users/{id}/permissions:
