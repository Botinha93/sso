            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
  /auth/login/webauthn/begin:
    post:
      summary: Start WebAuthn passwordless login flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: Username, email, or user ID
                clientId:
                  type: string
                  nullable: true
                  description: Optional OAuth client ID
                tenantSlug:
                  type: string
                  nullable: true
                  description: Optional tenant slug
                scope:
                  type: array
                  items:
                    type: string
                  description: Requested scopes
      responses:
        '200':
          description: WebAuthn challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginId:
                    type: string
                  challenge:
                    type: string
                    format: base64
                  allowCredentials:
                    type: array
                    items:
                      type: object
        '401':
          description: User not found or no passkey enrolled
        '400':
          description: Invalid request parameters
  /auth/login/webauthn/finish:
    post:
      summary: Complete WebAuthn login with assertion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, credentialId]
              properties:
                loginId:
                  type: string
                credentialId:
                  type: string
                signCount:
                  type: integer
                  minimum: 0
                assertion:
                  type: string
                  format: base64
      responses:
        '200':
          description: Login successful and session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
        '401':
          description: Invalid assertion or signature
        '400':
          description: Invalid parameters
  /api/account/mfa/totp:
    get:
