            application/json:
              schema:
                type: object
                properties:
                  samlResponse:
                    type: string
                  relayState:
                    type: string
        '401':
          description: No active session and no valid user context
        '400':
          description: Invalid service provider or payload
  /saml/acs/{spId}:
    post:
      summary: Verify signature, validate, and audit inbound SAML assertion response
      parameters:
        - in: path
          name: spId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: Base64-encoded SAML response XML
                RelayState:
                  type: string
      responses:
        '200':
          description: Assertion accepted and audited
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  userId:
                    type: string
                  sessionId:
                    type: string
        '400':
          description: Assertion validation failed
        '422':
          description: Assertion security validation failed (signature/signature-wrapping/audience/destination/expiry/replay)
        '404':
          description: Service provider not found
  /saml/slo:
