                    $ref: '#/components/schemas/ElevationRequest'
                  session:
                    $ref: '#/components/schemas/ElevationSession'
        '404':
          description: Elevation request not found
        '409':
          description: Request is not in approved status
  /api/admin/elevations/{id}/revoke:
    post:
