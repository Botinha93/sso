          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                clientId:
                  type: string
                tenantSlug:
                  type: string
      responses:
        '200':
          description: Enumeration-safe recovery request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  expiresIn:
                    type: integer
  /auth/recovery:
    post:
      summary: Complete account recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryTicket, newPassword]
              properties:
                recoveryTicket:
                  type: string
                code:
                  type: string
                verificationCode:
                  type: string
                newPassword:
                  type: string
                clientId:
                  type: string
                tenantSlug:
                  type: string
                scope:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Recovery completed
          content:
            application/json:
              schema:
                type: object
  /auth/federation/providers:
    get:
      summary: List enabled public federation providers
      responses:
        '200':
          description: Federation providers
