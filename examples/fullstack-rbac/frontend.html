<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Frontend -> Backend -> OAuth RBAC Example</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        color: #0f172a;
      }

      .card {
        max-width: 980px;
        margin: 0 auto;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 0 12px;
      }

      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: #475569;
      }

      input {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }

      .actions {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 1px solid #0f172a;
        background: #0f172a;
        color: white;
        border-radius: 8px;
        font-size: 13px;
        padding: 8px 10px;
        cursor: pointer;
      }

      button.secondary {
        background: white;
        color: #0f172a;
      }

      pre {
        margin-top: 14px;
        background: #0b1220;
        color: #dbeafe;
        border-radius: 10px;
        padding: 12px;
        min-height: 140px;
        overflow: auto;
        font-size: 12px;
      }

      .token {
        margin-top: 12px;
        font-size: 12px;
        color: #1e293b;
        word-break: break-all;
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Frontend Login + Backend OAuth Authorization</h1>
      <p>
        This example logs in on the frontend, sends the access token to your backend, and your backend checks OAuth
        before authorizing route access using roles and permissions.
      </p>

      <div class="grid">
        <label>
          Backend URL
          <input id="backendUrl" value="http://127.0.0.1:3100" />
        </label>
        <label>
          Client ID (for /auth/login)
          <input id="clientId" value="sso-admin-ui" />
        </label>
        <label>
          User Email
          <input id="email" value="admin@example.com" />
        </label>
        <label>
          Password
          <input id="password" type="password" value="change-me-now" />
        </label>
      </div>

      <div class="actions">
        <button id="loginBtn">1) Login</button>
        <button class="secondary" id="meBtn">2) Call /api/me</button>
        <button class="secondary" id="reportsBtn">3) Call /api/admin/reports</button>
        <button class="secondary" id="payoutsBtn">4) Call /api/finance/payouts</button>
        <button class="secondary" id="clearBtn">Clear Output</button>
      </div>

      <div class="token" id="tokenInfo">No access token yet.</div>
      <pre id="output">Ready.</pre>
    </div>

    <script>
      let accessToken = null

      const output = document.getElementById('output')
      const tokenInfo = document.getElementById('tokenInfo')
      const backendUrlInput = document.getElementById('backendUrl')

      const pretty = (value) => JSON.stringify(value, null, 2)

      const append = (title, payload) => {
        output.textContent = `${output.textContent}\n\n=== ${title} ===\n${typeof payload === 'string' ? payload : pretty(payload)}`
      }

      const backendUrl = () => backendUrlInput.value.replace(/\/$/, '')

      const send = async (path) => {
        if (!accessToken) {
          append('error', 'Login first to get an access token.')
          return
        }

        const res = await fetch(`${backendUrl()}${path}`, {
          headers: { authorization: `Bearer ${accessToken}` }
        })
        const text = await res.text()
        let body
        try {
          body = JSON.parse(text)
        } catch {
          body = text
        }
        append(`${path} (${res.status})`, body)
      }

      document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('email').value
        const password = document.getElementById('password').value
        const clientId = document.getElementById('clientId').value

        const res = await fetch(`${backendUrl()}/api/session/login`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            email,
            password,
            clientId,
            scope: ['openid', 'profile', 'email', 'roles', 'permissions']
          })
        })

        const body = await res.json()
        append(`login (${res.status})`, body)

        if (res.ok && body.access_token) {
          accessToken = body.access_token
          tokenInfo.textContent = `Access token acquired. Prefix: ${accessToken.slice(0, 32)}...`
        } else {
          accessToken = null
          tokenInfo.textContent = 'Login failed. Check response output.'
        }
      }

      document.getElementById('meBtn').onclick = () => send('/api/me')
      document.getElementById('reportsBtn').onclick = () => send('/api/admin/reports')
      document.getElementById('payoutsBtn').onclick = () => send('/api/finance/payouts')
      document.getElementById('clearBtn').onclick = () => {
        output.textContent = 'Cleared.'
      }
    </script>
  </body>
</html>
